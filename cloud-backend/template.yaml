AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: KTs Smart Agriculture - Cloud Backend for AI Plant Disease Diagnosis

# ============================================================
# Parameters
# ============================================================
Parameters:
  AdminEmail:
    Type: String
    Description: Email address to receive CloudWatch Alarm notifications
  Environment:
    Type: String
    Default: prod
    Description: Deployment environment name
  WafAclArn:
    Type: String
    Description: WAF WebACL ARN from waf-stack.yaml (deploy first in us-east-1)

# ============================================================
# Globals
# NOTE: Runtime is NOT set here because AiInferenceFunction uses
#       PackageType: Image which is incompatible with Runtime/Handler.
#       Each zip-based function sets Runtime explicitly instead.
# ============================================================
Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Architectures:
      - x86_64
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        POWERTOOLS_SERVICE_NAME: kts-smart-agri

# ============================================================
# Resources
# ============================================================
Resources:

  # ----------------------------------------------------------
  # Cognito User Pool
  # ----------------------------------------------------------
  AgriUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub kts-smart-agri-user-pool-${Environment}
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false

  AgriUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub kts-smart-agri-client-${Environment}
      UserPoolId: !Ref AgriUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH

  # ----------------------------------------------------------
  # API Gateway
  # ----------------------------------------------------------
  AgriApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub kts-smart-agri-api-${Environment}
      StageName: !Ref Environment
      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Requested-With'"
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        MaxAge: "'600'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt AgriUserPool.Arn

  # ----------------------------------------------------------
  # SQS Queue -- buffer between S3 trigger and AI Inference Lambda
  # S3 -> SQS -> Lambda (instead of S3 -> Lambda directly)
  # ----------------------------------------------------------
  AgriInferenceQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub kts-smart-agri-inference-${Environment}
      VisibilityTimeout: 120        # >= Lambda timeout (60s) * 2
      MessageRetentionPeriod: 86400 # 1 day
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt AgriInferenceDLQ.Arn
        maxReceiveCount: 3          # retry 3 times before sending to DLQ

  # Dead Letter Queue -- holds messages that failed after 3 attempts
  AgriInferenceDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub kts-smart-agri-inference-dlq-${Environment}
      MessageRetentionPeriod: 1209600 # 14 days

  # Policy allowing S3 to send messages to SQS
  AgriInferenceQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref AgriInferenceQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowS3SendMessage
            Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt AgriInferenceQueue.Arn
            Condition:
              ArnLike:
                aws:SourceArn: !Sub arn:aws:s3:::kts-smart-agri-images-${AWS::AccountId}-${Environment}

  AgriImagesBucket:
    Type: AWS::S3::Bucket
    DependsOn: AgriInferenceQueuePolicy
    Properties:
      BucketName: !Sub kts-smart-agri-images-${AWS::AccountId}-${Environment}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedMethods:
              - PUT
              - HEAD
            AllowedOrigins:
              - '*'
            AllowedHeaders:
              - '*'
            MaxAge: 3000
      NotificationConfiguration:
        # S3 sends events to SQS instead of invoking Lambda directly
        QueueConfigurations:
          - Event: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: uploads/
            Queue: !GetAtt AgriInferenceQueue.Arn

  # ----------------------------------------------------------
  # ECR Repository
  # ----------------------------------------------------------
  AgriEcrRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub kts-smart-agri-ai-inference-${Environment}
      ImageScanningConfiguration:
        ScanOnPush: true

  # ----------------------------------------------------------
  # S3 Archive Bucket -- stores processed images (step 9)
  # S3 Lifecycle Policy auto-deletes objects after 90 days
  # ----------------------------------------------------------
  AgriArchiveBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub kts-smart-agri-archive-${AWS::AccountId}-${Environment}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireProcessedImages
            Status: Enabled
            ExpirationInDays: 90

  # ----------------------------------------------------------
  # DynamoDB Table
  # ----------------------------------------------------------
  AgriDiagnosisTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub kts-smart-agri-diagnosis-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: imageId
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: imageId
          KeyType: RANGE
      # GSI for GET /images -- query by userId, sorted newest first
      GlobalSecondaryIndexes:
        - IndexName: userId-createdAt-index
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # ----------------------------------------------------------
  # Lambda: presign-url
  # ----------------------------------------------------------
  PresignUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub kts-smart-agri-presign-url-${Environment}
      CodeUri: functions/presign-url/
      Handler: app.lambda_handler
      Runtime: python3.13
      Description: Generate S3 Pre-signed PUT URL for image upload
      Environment:
        Variables:
          IMAGES_BUCKET_NAME: !Ref AgriImagesBucket
      Policies:
        - S3WritePolicy:
            BucketName: !Ref AgriImagesBucket
      Events:
        PresignApi:
          Type: Api
          Properties:
            RestApiId: !Ref AgriApi
            Path: /images/presign
            Method: POST

  # ----------------------------------------------------------
  # Lambda: ai-inference (Docker/ECR)
  # PackageType: Image -- Runtime and Handler must NOT be specified
  # ----------------------------------------------------------
  AiInferenceFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerTag: latest
      DockerContext: ./functions/ai-inference
      Dockerfile: Dockerfile
    Properties:
      FunctionName: !Sub kts-smart-agri-ai-inference-${Environment}
      PackageType: Image
      Description: AI inference for plant disease diagnosis (ResNet50 - PlantVillage 38 classes)
      Timeout: 120        # cold start load model ~15-30s + inference ~3s
      MemorySize: 1536    # ResNet50 needs ~400MB RAM
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref AgriDiagnosisTable
          ARCHIVE_BUCKET_NAME: !Ref AgriArchiveBucket
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AgriDiagnosisTable
        - S3ReadPolicy:
            BucketName: !Ref AgriImagesBucket
        - S3WritePolicy:
            BucketName: !Ref AgriArchiveBucket
        - SQSPollerPolicy:
            QueueName: !GetAtt AgriInferenceQueue.QueueName
      Events:
        # SQS trigger: S3 -> SQS -> Lambda
        InferenceQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt AgriInferenceQueue.Arn
            BatchSize: 1
            FunctionResponseTypes:
              - ReportBatchItemFailures

  # ----------------------------------------------------------
  # Lambda: get-result
  # ----------------------------------------------------------
  GetResultFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub kts-smart-agri-get-result-${Environment}
      CodeUri: functions/get-result/
      Handler: app.lambda_handler
      Runtime: python3.13
      Description: Get diagnosis result by imageId or list all results for a user
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref AgriDiagnosisTable
          IMAGES_BUCKET_NAME: !Ref AgriImagesBucket
          ARCHIVE_BUCKET_NAME: !Ref AgriArchiveBucket
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AgriDiagnosisTable
        - S3ReadPolicy:
            BucketName: !Ref AgriImagesBucket
        - S3ReadPolicy:
            BucketName: !Ref AgriArchiveBucket
        - S3CrudPolicy:
            BucketName: !Ref AgriImagesBucket
        - S3CrudPolicy:
            BucketName: !Ref AgriArchiveBucket
      Events:
          Type: Api
          Properties:
            RestApiId: !Ref AgriApi
            Path: /images/{imageId}/result
            Method: GET
        ListImagesApi:
          Type: Api
          Properties:
            RestApiId: !Ref AgriApi
            Path: /images
            Method: GET
        DeleteImageApi:
          Type: Api
          Properties:
            RestApiId: !Ref AgriApi
            Path: /images/{imageId}/result
            Method: DELETE

  # ----------------------------------------------------------
  # Lambda: data-maintenance
  # ----------------------------------------------------------
  DataMaintenanceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub kts-smart-agri-data-maintenance-${Environment}
      CodeUri: functions/data-maintenance/
      Handler: app.lambda_handler
      Runtime: python3.13
      Description: Clean up old S3 images and archive DynamoDB records
      Timeout: 300
      Environment:
        Variables:
          IMAGES_BUCKET_NAME: !Ref AgriImagesBucket
          DYNAMODB_TABLE_NAME: !Ref AgriDiagnosisTable
          RETENTION_DAYS: '30'
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref AgriImagesBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref AgriDiagnosisTable
      Events:
        WeeklySchedule:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0 0 ? * SUN *)
            Description: Weekly data maintenance every Sunday at 00:00 UTC

  # ----------------------------------------------------------
  # CloudWatch Log Groups (retention 30 days)
  # ----------------------------------------------------------
  PresignUrlLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/kts-smart-agri-presign-url-${Environment}
      RetentionInDays: 30

  AiInferenceLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/kts-smart-agri-ai-inference-${Environment}
      RetentionInDays: 30

  GetResultLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/kts-smart-agri-get-result-${Environment}
      RetentionInDays: 30

  DataMaintenanceLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/kts-smart-agri-data-maintenance-${Environment}
      RetentionInDays: 30

  # ----------------------------------------------------------
  # SNS Topic + Email Subscription
  # ----------------------------------------------------------
  AgriAlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub kts-smart-agri-alerts-${Environment}

  AgriAlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AgriAlertTopic
      Protocol: email
      Endpoint: !Ref AdminEmail

  # ----------------------------------------------------------
  # CloudWatch Alarms
  # ----------------------------------------------------------
  AiInferenceErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub kts-agri-ai-inference-errors-${Environment}
      AlarmDescription: AI Inference Lambda error rate >= 1 in 5 minutes
      MetricName: Errors
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Ref AiInferenceFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AgriAlertTopic

  PresignUrlErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub kts-agri-presign-url-errors-${Environment}
      AlarmDescription: PresignUrl Lambda error rate >= 1 in 5 minutes
      MetricName: Errors
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Ref PresignUrlFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AgriAlertTopic

  DynamoDBSystemErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub kts-agri-dynamodb-system-errors-${Environment}
      AlarmDescription: DynamoDB system errors >= 1 in 5 minutes
      MetricName: SystemErrors
      Namespace: AWS/DynamoDB
      Dimensions:
        - Name: TableName
          Value: !Ref AgriDiagnosisTable
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AgriAlertTopic

  # ----------------------------------------------------------
  # CloudTrail
  # ----------------------------------------------------------
  CloudTrailBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub kts-smart-agri-cloudtrail-${AWS::AccountId}-${Environment}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  CloudTrailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CloudTrailBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AWSCloudTrailAclCheck
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt CloudTrailBucket.Arn
          - Sid: AWSCloudTrailWrite
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub ${CloudTrailBucket.Arn}/AWSLogs/${AWS::AccountId}/*
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control

  AgriCloudTrail:
    Type: AWS::CloudTrail::Trail
    DependsOn: CloudTrailBucketPolicy
    Properties:
      TrailName: !Sub kts-smart-agri-trail-${Environment}
      IsLogging: true
      S3BucketName: !Ref CloudTrailBucket
      IncludeGlobalServiceEvents: true
      IsMultiRegionTrail: false
      EventSelectors:
        - ReadWriteType: All
          IncludeManagementEvents: true
          DataResources:
            - Type: AWS::S3::Object
              Values:
                - !Sub ${AgriImagesBucket.Arn}/

  # ----------------------------------------------------------
  # CloudFront Distribution
  # Origin: API Gateway
  # WAF: passed via Parameter WafAclArn (cross-region import not allowed)
  # NOTE: deploy waf-stack.yaml in us-east-1 first, get ARN and pass as WafAclArn
  # ----------------------------------------------------------
  AgriCloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub KTS Smart Agriculture - ${Environment}
        WebACLId: !Ref WafAclArn
        # Origin: API Gateway endpoint
        Origins:
          - Id: ApiGatewayOrigin
            DomainName: !Sub ${AgriApi}.execute-api.${AWS::Region}.amazonaws.com
            OriginPath: !Sub /${Environment}
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
        DefaultCacheBehavior:
          TargetOriginId: ApiGatewayOrigin
          ViewerProtocolPolicy: redirect-to-https
          # Do not cache API responses
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # CachingDisabled managed policy
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # AllViewerExceptHostHeader
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
            - PUT
            - POST
            - PATCH
            - DELETE
          CachedMethods:
            - GET
            - HEAD
        HttpVersion: http2
        PriceClass: PriceClass_All

# ============================================================
# Outputs
# ============================================================
Outputs:
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref AgriUserPool
    Export:
      Name: !Sub kts-smart-agri-user-pool-id-${Environment}

  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref AgriUserPoolClient
    Export:
      Name: !Sub kts-smart-agri-user-pool-client-id-${Environment}

  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub https://${AgriApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
    Export:
      Name: !Sub kts-smart-agri-api-endpoint-${Environment}

  ImagesBucketName:
    Description: S3 bucket name for images
    Value: !Ref AgriImagesBucket
    Export:
      Name: !Sub kts-smart-agri-images-bucket-${Environment}

  DiagnosisTableName:
    Description: DynamoDB table name for diagnosis results
    Value: !Ref AgriDiagnosisTable
    Export:
      Name: !Sub kts-smart-agri-diagnosis-table-${Environment}

  EcrRepositoryUri:
    Description: ECR repository URI for AI inference image
    Value: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${AgriEcrRepository}
    Export:
      Name: !Sub kts-smart-agri-ecr-uri-${Environment}

  ArchiveBucketName:
    Description: S3 archive bucket name for processed images
    Value: !Ref AgriArchiveBucket
    Export:
      Name: !Sub kts-smart-agri-archive-bucket-${Environment}

  CloudFrontDomain:
    Description: CloudFront distribution domain -- entry point for all API calls
    Value: !GetAtt AgriCloudFrontDistribution.DomainName
    Export:
      Name: !Sub kts-smart-agri-cloudfront-domain-${Environment}
